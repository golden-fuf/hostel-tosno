<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2d7d46">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Хостел Тосно</title>
    
    <!-- ФАВИКОН -->
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <h2>🔐 Вход в систему</h2>
            <p>Введите токен доступа</p>
            <input type="password" id="authToken" placeholder="Токен..." autocomplete="off">
            <button onclick="doAuth()">Войти</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Хостел <span class="subtitle">Тосно</span>
                </h1>
                <div class="header-actions">
                    
                    <!-- Скачать TXT (скрывается у гостя) -->
                    <button class="btn-icon btn-export-allowed" onclick="window.location.href='/api/export/txt?token=' + localStorage.getItem('hostel_auth_token')" title="Скачать TXT (бэкап)">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    
                    <!-- Отчёт (бывшая Статистика) -->
                    <button class="btn-icon" onclick="showReport()" title="Отчёт">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                            <rect x="8" y="13" width="2" height="6"></rect>
                            <rect x="12" y="11" width="2" height="8"></rect>
                            <rect x="16" y="9" width="2" height="10"></rect>
                        </svg>
                    </button>
                    
                    <!-- Заселить (иконка с чемоданом) -->
                    <button class="btn-icon btn-edit-allowed" onclick="showAddForm()" title="Заселить">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="5" r="2"></circle>
                            <path d="M12 7v4"></path>
                            <path d="M10 11h4"></path>
                            <path d="M10 11l-1 6h6l-1-6"></path>
                            <rect x="2" y="12" width="6" height="8" rx="1"></rect>
                            <path d="M4 12v-2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"></path>
                            <line x1="2" y1="16" x2="8" y2="16"></line>
                            <rect x="18" y="14" width="4" height="5" rx="1"></rect>
                            <path d="M19 14v-1a1 1 0 0 1 1-1h0a1 1 0 0 1 1 1v1"></path>
                        </svg>
                    </button>
                    
                    <!-- Редактирование (бывшие Настройки) -->
                    <button class="btn-icon btn-edit-allowed" onclick="showSettings()" title="Редактирование">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12a8 8 0 0 1 8-8"></path>
                            <polyline points="4 4 4 12 12 12"></polyline>
                            <path d="M20 12a8 8 0 0 1-8 8"></path>
                            <polyline points="20 20 20 12 12 12"></polyline>
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                        </svg>
                    </button>
                    
                    <!-- Кнопка выхода (видна ВСЕМ, включая гостей) -->
                    <button class="btn-icon" onclick="logout()" title="Выйти">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item"><span class="stat-label">Всего</span><span class="stat-value" id="totalCount">0</span></div>
            <div class="stat-item"><span class="stat-label">Занято</span><span class="stat-value occupied" id="occupiedCount">0</span></div>
            <div class="stat-item"><span class="stat-label">Свободно</span><span class="stat-value free" id="freeCount">0</span></div>
            <div class="stat-item"><span class="stat-label">Загрузка</span><span class="stat-value" id="loadPercent">0%</span></div>
        </div>

        <div class="search-section">
            <div class="search-bar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Поиск по имени, комнате, группе..." style="padding-left:44px;">
                <button class="btn-clear" onclick="clearSearch()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="floor-filter" id="floorFilter">
                <span class="floor-label">Этаж:</span>
                <div class="floor-tabs" id="floorTabs"></div>
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-group="all" onclick="filterByGroup('all')">Все</button>
                <button class="filter-tab" data-group="occupied" onclick="filterByGroup('occupied')">Занятые</button>
                <button class="filter-tab" data-group="free" onclick="filterByGroup('free')">Свободные</button>
            </div>
        </div>

        <div class="rooms-container" id="roomsContainer">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
