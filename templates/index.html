<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2d7d46">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Хостел Тосно</title>
    
    <!-- ФАВИКОН -->
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <h2>🔐 Вход в систему</h2>
            <p>Введите токен доступа</p>
            <input type="password" id="authToken" placeholder="Токен..." autocomplete="off">
            <button onclick="doAuth()">Войти</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Хостел <span class="subtitle">Тосно</span>
                </h1>
                <div class="header-actions">
                    
                    <!-- Скачать TXT (скрывается у гостя) - Иконка дискеты -->
                    <button class="btn-icon btn-export-allowed" onclick="window.location.href='/api/export/txt?token=' + localStorage.getItem('hostel_auth_token')" title="Скачать TXT (бэкап)">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                    </button>
                    
                    <!-- Отчёт - Иконка документа со списком -->
                    <button class="btn-icon" onclick="showReport()" title="Отчёт">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="9" x2="15" y2="9"></line>
                            <line x1="9" y1="13" x2="15" y2="13"></line>
                            <line x1="9" y1="17" x2="15" y2="17"></line>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                        </svg>
                    </button>
                    
                    <!-- Заселить - Иконка человека в дверях -->
                    <button class="btn-icon btn-edit-allowed" onclick="showAddForm()" title="Заселить">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 4h3a2 2 0 0 1 2 2v14"></path>
                            <path d="M2 20h3"></path>
                            <path d="M13 20h9"></path>
                            <path d="M10 12v.01"></path>
                            <path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.562Z"></path>
                            <circle cx="17" cy="9" r="2"></circle>
                            <path d="M17 11v3"></path>
                            <path d="M17 14l-2 4"></path>
                            <path d="M17 14l2 4"></path>
                        </svg>
                    </button>
                    
                    <!-- Редактирование - Иконка карандаша -->
                    <button class="btn-icon btn-edit-allowed" onclick="showSettings()" title="Редактирование">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                        </svg>
                    </button>
                    
                    <!-- Кнопка выхода - Иконка выхода из рамки -->
                    <button class="btn-icon" onclick="logout()" title="Выйти">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item"><span class="stat-label">Всего</span><span class="stat-value" id="totalCount">0</span></div>
            <div class="stat-item"><span class="stat-label">Занято</span><span class="stat-value occupied" id="occupiedCount">0</span></div>
            <div class="stat-item"><span class="stat-label">Свободно</span><span class="stat-value free" id="freeCount">0</span></div>
            <div class="stat-item"><span class="stat-label">Загрузка</span><span class="stat-value" id="loadPercent">0%</span></div>
        </div>

        <div class="search-section">
            <div class="search-bar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Поиск по имени, комнате, группе..." style="padding-left:44px;">
                <button class="btn-clear" onclick="clearSearch()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="floor-filter" id="floorFilter">
                <span class="floor-label">Этаж:</span>
                <div class="floor-tabs" id="floorTabs"></div>
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-group="all" onclick="filterByGroup('all')">Все</button>
                <button class="filter-tab" data-group="occupied" onclick="filterByGroup('occupied')">Занятые</button>
                <button class="filter-tab" data-group="free" onclick="filterByGroup('free')">Свободные</button>
            </div>
        </div>

        <div class="rooms-container" id="roomsContainer">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
